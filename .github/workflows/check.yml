name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and ZIP tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip unzip
      - name: Check Lua and secrets
        run: sh scripts/check.sh
      - name: Build installation ZIP
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jjwxc-koreader
          path: dist/*.zip
